name: Build iOS IPA (LiquidMail)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build & Package LiquidMail.ipa
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          xcodebuild -project LiquidMail.xcodeproj -scheme LiquidMail -showdestinations

      - name: Build Archive (No Signing / Sideload-Ready)
        run: |
          set +e
          xcodebuild archive \
            -project LiquidMail.xcodeproj \
            -scheme LiquidMail \
            -sdk iphoneos \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/LiquidMail.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES 2>&1 | tee xcodebuild.log
          STATUS=${PIPESTATUS[0]}
          if [ $STATUS -ne 0 ]; then
            echo "## ❌ Xcodebuild failed with code $STATUS" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E "error:" xcodebuild.log | head -n 30 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $STATUS
          fi

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -r build/LiquidMail.xcarchive/Products/Applications/LiquidMail.app Payload/
          zip -r LiquidMail.ipa Payload/
          ls -lh LiquidMail.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiquidMail-iOS-IPA
          path: LiquidMail.ipa
          retention-days: 14

      - name: Create Release and Upload IPA (on git tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: LiquidMail.ipa
          name: "LiquidMail ${{ github.ref_name }}"
          body: |
            ## 🫧 LiquidMail iOS Release
            - **Design** : Minimaliste Liquid Glass (iOS 17 & 18+)
            - **Moteur IA** : Triage automatique (OpenAI, Claude, Mistral, Gemini, Apple Intelligence)
            - **Installation** : Téléchargez `LiquidMail.ipa` et installez-le via AltStore, Sideloadly, TrollStore ou votre compte développeur Apple.
          draft: false
          prerelease: false
